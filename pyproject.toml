[project]
name = "diffrax"
version = "0.6.0"
description = "GPU+autodiff-capable ODE/SDE/CDE solvers written in JAX."
readme = "README.md"
requires-python ="~=3.9"
license = {file = "LICENSE"}
authors = [
  {name = "Patrick Kidger", email = "contact@kidger.site"},
]
keywords = ["jax", "dynamical-systems", "differential-equations", "deep-learning", "equinox", "neural-differential-equations", "diffrax"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Mathematics",
]
urls = {repository = "https://github.com/patrick-kidger/diffrax" }
dependencies = ["jax>=0.4.28", "jaxtyping>=0.2.24", "typing_extensions>=4.5.0", "typeguard==2.13.3", "equinox>=0.11.2", "lineax>=0.0.5", "optimistix>=0.0.7"]

# uv: this fork is only developed on Linux with Python 3.12+ and the CUDA build of JAX
# (installed by default through the `gpu` group; `uv sync --no-default-groups` for CPU).
# The fork predates JAX 0.4.36 (it still uses `jax.core.ConcreteArray`, removed there), so
# JAX is held at 0.4.35 here; lift the constraint when the fork is rebased on upstream.
[tool.uv]
environments = ["sys_platform == 'linux' and python_version >= '3.12' and python_version < '3.14'"]
default-groups = ["dev", "gpu"]
constraint-dependencies = ["jax>=0.4.31,<0.4.36", "jaxlib>=0.4.31,<0.4.36", "nvidia-cuda-nvcc-cu12<12.8"]  # newer nvcc wheels are namespace packages that jax<0.4.36 cannot import

[dependency-groups]
dev = ["pytest", "pytest-xdist", "beartype", "jaxtyping", "pre-commit"]
gpu = ["jax[cuda12]>=0.4.31,<0.4.36"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["diffrax/*"]

[tool.pytest.ini_options]
addopts = "--jaxtyping-packages=diffrax,beartype.beartype(conf=beartype.BeartypeConf(strategy=beartype.BeartypeStrategy.On))"
markers = ["slow"]

[tool.ruff]
extend-include = ["*.ipynb"]
src = []

[tool.ruff.lint]
fixable = ["I001", "F401"]
ignore = ["E402", "E721", "E731", "E741", "F722"]
ignore-init-module-imports = true
select = ["E", "F", "I001"]

[tool.ruff.lint.isort]
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
lines-after-imports = 2
order-by-type = false

[tool.pyright]
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = false  # Incompatible with eqx.AbstractVar
reportUnnecessaryTypeIgnoreComment = true
include = ["diffrax", "tests"]
